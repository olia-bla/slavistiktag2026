<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slavistiktag 2026 · Programm &amp; Themen</title>
  <meta name="description" content="Konferenz-App zum 15. Deutschen Slavistiktag 2026 in Jena: Programm mit Suche, Filter, Favoriten und ICS – plus Sprachen- und Themenkompass.">
  <meta name="theme-color" content="#002f5d">
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("slavtag26.theme"); } catch (e) {}
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
    })();
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/slavistiktag-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/slavistiktag-icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/startseite">
      <img class="brand-logo" src="icons/slavistiktag logo.svg" alt="15. Slavistiktag 2026 · Friedrich-Schiller-Universität Jena" width="3000" height="3000">
    </a>
    <nav id="main-nav" class="main-nav" aria-label="Hauptnavigation"></nav>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Dunkelmodus aktivieren" title="Farbschema wechseln">
      <span class="theme-icon" aria-hidden="true">
        <svg class="theme-symbol theme-symbol-moon" viewBox="0 0 24 24">
          <path d="M20 15.2A8.5 8.5 0 0 1 8.8 4a8.5 8.5 0 1 0 11.2 11.2Z"/>
        </svg>
        <svg class="theme-symbol theme-symbol-sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3.5"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </span><span class="theme-label">Dunkel</span>
    </button>
  </header>
  <main id="app" class="app-main"></main>
  <footer class="site-footer">
    <p>
      Konferenz-App zum <a href="https://www.gw.uni-jena.de/52745/15-slavistiktag-2026" target="_blank" rel="noopener">15. Deutschen Slavistiktag</a> ·
      Programmdaten automatisch aus dem <a href="https://www.conftool.com/slavistiktag2026/" target="_blank" rel="noopener">ConfTool</a> der Tagung<span id="footer-stand"></span>
      App: <a href="https://github.com/olia-bla" target="_blank" rel="noopener">Olia Blacher</a> ·
      Diese App basiert auf einer von Prof. Dr. Achim Rabus entwickelten Vorlage. Dafür danken wir ihm herzlich.
    </p>
  </footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
