<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slavistiktag 2026 · Programm &amp; Themen</title>
  <meta name="description" content="Experimentelle App zum 15. Deutschen Slavistiktag 2026 in Jena: Programm mit Suche, Filter, Favoriten und ICS – plus Themen-Kompass (Data Mining).">
  <meta name="theme-color" content="#002f5d">
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("slavtag26.theme"); } catch (e) {}
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
    })();
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/slavistiktag-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/slavistiktag-icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/heute">
      <img class="brand-logo" src="icons/slavistiktag logo.svg" alt="15. Slavistiktag 2026 · Friedrich-Schiller-Universität Jena" width="3000" height="3000">
    </a>
    <nav id="main-nav" class="main-nav" aria-label="Hauptnavigation"></nav>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Dunkelmodus aktivieren" title="Farbschema wechseln">
      <span class="theme-icon" aria-hidden="true">☾</span><span class="theme-label">Dunkel</span>
    </button>
  </header>
  <main id="app" class="app-main"></main>
  <footer class="site-footer">
    <p>
      Experimentelle App zum <a href="https://www.gw.uni-jena.de/52745/15-slavistiktag-2026" target="_blank" rel="noopener">15. Deutschen Slavistiktag</a> ·
      Programmdaten automatisch aus dem <a href="https://www.conftool.com/slavistiktag2026/" target="_blank" rel="noopener">ConfTool</a> der Tagung<span id="footer-stand"></span>
      App: <a href="https://github.com/olia-bla" target="_blank" rel="noopener">Olia Blacher</a> ·
      Mit herzlichem Dank an Prof. Dr. Achim Rabus für die Idee und den ersten Entwurf ·
      <a href="https://github.com/olia-bla/slavistiktag2026" target="_blank" rel="noopener">Mitmachen auf GitHub</a>
    </p>
  </footer>
  <nav class="history-bar" aria-label="Seitennavigation">
    <div class="history-bar-inner">
      <button id="back-button" class="history-button" type="button" aria-label="Zurück" title="Zurück" disabled>
        <span class="history-arrow" aria-hidden="true">←</span><span>Zurück</span>
      </button>
      <button id="forward-button" class="history-button" type="button" aria-label="Weiter" title="Weiter" disabled>
        <span>Weiter</span><span class="history-arrow" aria-hidden="true">→</span>
      </button>
    </div>
  </nav>
  <script type="module" src="js/app.js"></script>
</body>
</html>
